# Builds release binaries and publishes them as a GitHub Release.
#
# Runs when a tag like v0.1.0 is pushed, or manually from the Actions tab
# (the tag is then created on the selected branch from the Cargo.toml version).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - name: Test
        run: cargo test --release --target x86_64-unknown-linux-musl
      - name: Build static binaries
        env:
          # Pure-Rust static builds link fine with the bundled LLD, so no
          # cross C toolchain is needed for aarch64.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          cargo build --release --target aarch64-unknown-linux-musl
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/axtail dist/axtail-linux-x86_64
          cp target/aarch64-unknown-linux-musl/release/axtail dist/axtail-linux-aarch64
          ./dist/axtail-linux-x86_64 --version
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo build --release
          mkdir dist
          cp target/release/axtail.exe dist/axtail-windows-x86_64.exe
          ./dist/axtail-windows-x86_64.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi
          cd dist
          sha256sum axtail-* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$tag" axtail-* SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "axtail ${tag#v}" \
            --generate-notes
